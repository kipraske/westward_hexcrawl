<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westward — a hexcrawl</title>
<style>
  :root {
    --bg:#14120e; --line:#332e25; --ink:#e8e2d4; --dim:#9a9083; --accent:#c9a227;
    --hex-w:107.4px;          /* √3 × SIZE, must match SIZE in map.js */
    --hex-h:124px;            /*  2  × SIZE                            */
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:16px/1.55 ui-serif, Georgia, "Times New Roman", serif;
  }

  header {
    position:fixed; top:0; left:0; right:0; z-index:3;
    display:flex; align-items:baseline; gap:1rem;
    padding:.9rem 1.2rem;
    background:linear-gradient(var(--bg), rgba(20,18,14,.75) 70%, transparent);
  }
  h1 { font-size:1.15rem; margin:0; letter-spacing:.06em; font-weight:600; }
  header .hint { color:var(--dim); font-size:.78rem; font-style:italic; }
  header button {
    font:inherit; font-size:.78rem; padding:.3rem .8rem;
    background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:2px; cursor:pointer;
  }
  header button:hover { color:var(--ink); border-color:var(--dim); }
  #marker { margin-left:auto; }

  /* ── the board ─────────────────────────────────────────────────────── */
  #stage { position:absolute; inset:0; overflow:hidden; }
  #map   { position:absolute; inset:0; transition:transform .55s cubic-bezier(.3,.8,.3,1); }

  .hex {
    position:absolute; width:var(--hex-w); height:var(--hex-h);
    padding:0; border:none; background:#333; cursor:default;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    /* translate(-50%,-50%) turns the left/top pixel pair into a CENTRE
       position, which is what the axial maths produces. scale() rides along
       for the grow-in, so both live in the same transform. */
    transform:translate(-50%,-50%) scale(.2);
    opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.35),
               opacity .35s ease, filter .45s ease;
    display:grid; place-items:center;
  }
  .hex.in { transform:translate(-50%,-50%) scale(1); opacity:1; }

  .hex .label {
    font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    text-align:center; padding:0 .9rem; line-height:1.25;
    color:#f4efe2; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
    pointer-events:none;
  }

  .hex.choice  { cursor:pointer; }
  .hex.choice:hover  { transform:translate(-50%,-50%) scale(1.07); filter:brightness(1.18); }
  .hex.choice:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .hex.current { filter:brightness(1.1) saturate(1.15); z-index:2; }
  /* Dimmed enough to read as "already passed", bright enough to still see the
     terrain. The previous values stacked grayscale(.55), brightness(.5) AND
     opacity(.55), which multiply out to roughly 27% effective luminance — the
     hex went nearly black. Two gentler knobs instead of three harsh ones. */
  .hex.visited { filter:grayscale(.3) brightness(.82); opacity:.85; z-index:0; }
  .hex.visited .label { opacity:.75; }

  /* ── the marker: two implementations, one visible at a time ───────────
     A clip-path clips border and box-shadow along with everything else, so
     the "ring" option cannot be a border. It's a second hex sitting behind
     the current one, slightly larger, showing as a rim around the edge.
     (+10px of width needs +11.5px of height to stay the same hex: the
     aspect ratio is 2/√3.)                                                */
  .ring {
    position:absolute; z-index:1; opacity:0; pointer-events:none;
    width:calc(var(--hex-w) + 10px); height:calc(var(--hex-h) + 11.5px);
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background:var(--accent);
    transform:translate(-50%,-50%);
    transition:left .34s cubic-bezier(.3,.8,.3,1), top .34s cubic-bezier(.3,.8,.3,1), opacity .3s;
  }
  body.marker-ring .ring.placed { opacity:1; }

  .pawn {
    position:absolute; z-index:3; opacity:0; pointer-events:none;
    width:42px; height:56px;
    /* -62% rather than -50% so the base sits on the hex centre and the piece
       reads as standing on the tile instead of floating in it. */
    transform:translate(-50%,-62%);
    transition:left .34s cubic-bezier(.35,1.3,.5,1), top .34s cubic-bezier(.35,1.3,.5,1), opacity .3s;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.75));
  }
  body.marker-pawn .pawn.placed { opacity:1; }
  .pawn svg { width:100%; height:100%; }   /* colours live in the SVG itself */
  /* The panel already names the biome you're standing in, so the label on the
     current hex is redundant — the pawn can have the space. */
  body.marker-pawn .hex.current .label { opacity:0; }

  .arrow {
    position:absolute; z-index:3; width:32px; height:24px;
    background:none; border:none; padding:0; cursor:pointer; opacity:0;
    transform:translate(-50%,-50%) rotate(var(--angle)) scale(.4);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.4), opacity .3s, filter .2s;
  }
  .arrow.in { transform:translate(-50%,-50%) rotate(var(--angle)) scale(1); opacity:.7; }
  .arrow.in:hover, .arrow.in.aimed {
    transform:translate(-50%,-50%) rotate(var(--angle)) scale(1.22); opacity:1;
    filter:drop-shadow(0 0 5px rgba(255,244,214,.95));
  }
  /* Dark arrows, as asked — but they sit ON the choice hex, whose background
     ranges from Cavern's near-black to Frozen Lands' pale blue. Plain black
     would disappear on half the biomes, so each arrow is drawn twice: a thick
     pale stroke underneath as a halo, a near-black stroke on top. Legible on
     anything. */
  .arrow svg { width:100%; height:100%; fill:none;
               stroke-linecap:round; stroke-linejoin:round; }
  .arrow .halo { stroke:rgba(246,240,224,.8); stroke-width:5.4; }
  .arrow .line { stroke:#17120c; stroke-width:2.4; }
  .arrow:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* Hovering an arrow lights its hex and vice versa. */
  .hex.choice.aimed { transform:translate(-50%,-50%) scale(1.07); filter:brightness(1.22); }

  /* ── biome art ─────────────────────────────────────────────────────────
     Drawn by make_art.py; re-run it after editing a motif. Each tile is
     200x231 (the √3:2 ratio of a pointy-top hex) so `cover` scales it exactly
     with no cropping. Swap any one of these for a raster image and nothing
     else needs to change — the class names come from the page titles via
     biomeSlug() in map.js.                                                 */
  .plains                { background:url(assets/art/plains.svg) center/cover; }
  .temperate-grasslands  { background:url(assets/art/temperate-grasslands.svg) center/cover; }
  .tropical-grassland    { background:url(assets/art/tropical-grassland.svg) center/cover; }
  .frozen-lands          { background:url(assets/art/frozen-lands.svg) center/cover; }
  .swamp                 { background:url(assets/art/swamp.svg) center/cover; }
  .swamps                { background:url(assets/art/swamps.svg) center/cover; }
  .cavern                { background:url(assets/art/cavern.svg) center/cover; }
  .desert                { background:url(assets/art/desert.svg) center/cover; }
  .shadowy-desert        { background:url(assets/art/shadowy-desert.svg) center/cover; }
  .flame-scorched-desert { background:url(assets/art/flame-scorched-desert.svg) center/cover; }
  .forest                { background:url(assets/art/forest.svg) center/cover; }
  .enchanted-forest      { background:url(assets/art/enchanted-forest.svg) center/cover; }
  .haunted-forest        { background:url(assets/art/haunted-forest.svg) center/cover; }
  .jungle                { background:url(assets/art/jungle.svg) center/cover; }
  .mountains             { background:url(assets/art/mountains.svg) center/cover; }

  /* ── the panel ─────────────────────────────────────────────────────── */
  #panel {
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    padding:1.1rem 1.3rem 1.3rem;
    background:linear-gradient(transparent, rgba(16,14,11,.9) 22%, #100e0b 55%);
    border-top:1px solid var(--line);
    opacity:0; transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #panel.shown { opacity:1; transform:none; }
  #panel .place { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
                  color:var(--accent); margin-bottom:.35rem; }
  #panel .body  { font-size:1.05rem; max-width:52rem; }
  #panel .stem  { color:var(--dim); font-style:italic; }
  #panel .src   { margin-top:.45rem; font-size:.78rem; color:var(--dim); }
  #panel .die   { position:absolute; right:1.3rem; bottom:1.3rem;
                  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size:.72rem; color:var(--dim); }

  #status { position:fixed; inset:0; display:grid; place-items:center;
            color:var(--dim); font-style:italic; z-index:4; background:var(--bg); }
  #status.error { color:#c86a5a; font-style:normal; padding:2rem; text-align:center; }
  #status.gone  { display:none; }

  @media (prefers-reduced-motion: reduce) {
    .hex, #map, #panel { transition:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Westward</h1>
  <span class="hint">choose a hex to the west</span>
  <button id="marker" type="button">Marker: pawn</button>
  <button id="reset" type="button">New journey</button>
</header>

<div id="stage"><div id="map"></div></div>
<div id="panel"></div>
<div id="status">Loading the database…</div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<script type="module">
import { start, reset } from './assets/map.js';

const $status = document.getElementById('status');
document.getElementById('reset').addEventListener('click', reset);

// A/B the two ways of showing where you are. Both markers are always in the
// DOM; this only flips which one CSS reveals, so switching is instant and
// keeps your position.
const $marker = document.getElementById('marker');
document.body.className = 'marker-pawn';
$marker.addEventListener('click', () => {
  const pawn = document.body.classList.contains('marker-pawn');
  document.body.className = pawn ? 'marker-ring' : 'marker-pawn';
  $marker.textContent = `Marker: ${pawn ? 'ring' : 'pawn'}`;
});

try {
  await start();
  $status.classList.add('gone');
} catch (err) {
  $status.className = 'error';
  $status.textContent = `Could not load: ${err.message}. ` +
    `If you opened this file directly, serve it instead: python3 -m http.server`;
}
</script>
</body>
</html>
