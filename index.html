<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westward — a hexcrawl</title>
<style>
  :root {
    --bg:#14120e; --line:#332e25; --ink:#e8e2d4; --dim:#9a9083; --accent:#c9a227;
    --hex-w:107.4px;          /* √3 × SIZE, must match SIZE in map.js */
    --hex-h:124px;            /*  2  × SIZE                            */
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:16px/1.55 ui-serif, Georgia, "Times New Roman", serif;
  }

  header {
    position:fixed; top:0; left:0; right:0; z-index:3;
    display:flex; align-items:baseline; gap:1rem;
    padding:.9rem 1.2rem;
    background:linear-gradient(var(--bg), rgba(20,18,14,.75) 70%, transparent);
  }
  h1 { font-size:1.15rem; margin:0; letter-spacing:.06em; font-weight:600; }
  header .hint { color:var(--dim); font-size:.78rem; font-style:italic; }
  header button {
    margin-left:auto; font:inherit; font-size:.78rem; padding:.3rem .8rem;
    background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:2px; cursor:pointer;
  }
  header button:hover { color:var(--ink); border-color:var(--dim); }

  /* ── the board ─────────────────────────────────────────────────────── */
  #stage { position:absolute; inset:0; overflow:hidden; }
  #map   { position:absolute; inset:0; transition:transform .55s cubic-bezier(.3,.8,.3,1); }

  .hex {
    position:absolute; width:var(--hex-w); height:var(--hex-h);
    padding:0; border:none; background:#333; cursor:default;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    /* translate(-50%,-50%) turns the left/top pixel pair into a CENTRE
       position, which is what the axial maths produces. scale() rides along
       for the grow-in, so both live in the same transform. */
    transform:translate(-50%,-50%) scale(.2);
    opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.35),
               opacity .35s ease, filter .45s ease;
    display:grid; place-items:center;
  }
  .hex.in { transform:translate(-50%,-50%) scale(1); opacity:1; }

  .hex .label {
    font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    text-align:center; padding:0 .9rem; line-height:1.25;
    color:#f4efe2; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
    pointer-events:none;
  }

  .hex.choice  { cursor:pointer; }
  .hex.choice:hover  { transform:translate(-50%,-50%) scale(1.07); filter:brightness(1.18); }
  .hex.choice:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .hex.current { filter:brightness(1.1) saturate(1.15); z-index:2; }
  /* Dimmed enough to read as "already passed", bright enough to still see the
     terrain. The previous values stacked grayscale(.55), brightness(.5) AND
     opacity(.55), which multiply out to roughly 27% effective luminance — the
     hex went nearly black. Two gentler knobs instead of three harsh ones. */
  .hex.visited { filter:grayscale(.3) brightness(.82); opacity:.85; z-index:0; }
  .hex.visited .label { opacity:.75; }

  /* ── biome art ─────────────────────────────────────────────────────────
     Placeholders. To use a real image for a biome, replace that one rule's
     background with `background:url(art/forest.jpg) center/cover;` — nothing
     in the JS needs to change, the class names are generated from the page
     titles in map.js.                                                      */
  .plains                { background:linear-gradient(160deg,#9c8f4e 0%,#7d7a3c 55%,#5d5f2c 100%); }
  .temperate-grasslands  { background:linear-gradient(160deg,#93a24f 0%,#6f8b3d 60%,#54702f 100%); }
  .tropical-grassland    { background:linear-gradient(160deg,#b0a63f 0%,#7f9433 60%,#5c7328 100%); }
  .frozen-lands          { background:linear-gradient(160deg,#cfe0e8 0%,#9dbccd 55%,#6d8ea6 100%); }
  .swamp                 { background:linear-gradient(160deg,#5d6b3e 0%,#40522f 55%,#2b3a26 100%); }
  .swamps                { background:linear-gradient(160deg,#4e5c37 0%,#354528 55%,#222f1f 100%); }
  .cavern                { background:linear-gradient(160deg,#4a4740 0%,#302e2a 55%,#1a1917 100%); }
  .desert                { background:linear-gradient(160deg,#d9bb7c 0%,#c09a58 55%,#96733c 100%); }
  .shadowy-desert        { background:linear-gradient(160deg,#8a7f8f 0%,#645a70 55%,#413a4d 100%); }
  .flame-scorched-desert { background:linear-gradient(160deg,#d98a4a 0%,#b4552c 55%,#7d2f1c 100%); }
  .forest                { background:linear-gradient(160deg,#4c7a3f 0%,#33592d 55%,#1f3a20 100%); }
  .enchanted-forest      { background:linear-gradient(160deg,#4fa08a 0%,#3a7a72 50%,#37525f 100%); }
  .haunted-forest        { background:linear-gradient(160deg,#5a6660 0%,#3b4744 55%,#232c2b 100%); }
  .jungle                { background:linear-gradient(160deg,#3f8f4a 0%,#256b36 55%,#144424 100%); }
  .mountains             { background:linear-gradient(160deg,#9aa3ab 0%,#6b7580 55%,#454d57 100%); }

  /* ── the panel ─────────────────────────────────────────────────────── */
  #panel {
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    padding:1.1rem 1.3rem 1.3rem;
    background:linear-gradient(transparent, rgba(16,14,11,.9) 22%, #100e0b 55%);
    border-top:1px solid var(--line);
    opacity:0; transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #panel.shown { opacity:1; transform:none; }
  #panel .place { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
                  color:var(--accent); margin-bottom:.35rem; }
  #panel .body  { font-size:1.05rem; max-width:52rem; }
  #panel .stem  { color:var(--dim); font-style:italic; }
  #panel .src   { margin-top:.45rem; font-size:.78rem; color:var(--dim); }
  #panel .die   { position:absolute; right:1.3rem; bottom:1.3rem;
                  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size:.72rem; color:var(--dim); }

  #status { position:fixed; inset:0; display:grid; place-items:center;
            color:var(--dim); font-style:italic; z-index:4; background:var(--bg); }
  #status.error { color:#c86a5a; font-style:normal; padding:2rem; text-align:center; }
  #status.gone  { display:none; }

  @media (prefers-reduced-motion: reduce) {
    .hex, #map, #panel { transition:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Westward</h1>
  <span class="hint">choose a hex to the west</span>
  <button id="reset" type="button">New journey</button>
</header>

<div id="stage"><div id="map"></div></div>
<div id="panel"></div>
<div id="status">Loading the database…</div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<script type="module">
import { start, reset } from './map.js';

const $status = document.getElementById('status');
document.getElementById('reset').addEventListener('click', reset);

try {
  await start();
  $status.classList.add('gone');
} catch (err) {
  $status.className = 'error';
  $status.textContent = `Could not load: ${err.message}. ` +
    `If you opened this file directly, serve it instead: python3 -m http.server`;
}
</script>
</body>
</html>
